# Deploy web/dist to GitHub Pages on every push to main (or by hand). The QA gate in ci.yml
# runs first and must pass (company/BRIEF.md §4.8: the QA gate blocks deploys).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    name: QA gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build site
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (when web/package-lock.json exists)
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "No web/package-lock.json; the site builder needs no packages."; fi

      - name: Build
        run: node web/build.mjs

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
