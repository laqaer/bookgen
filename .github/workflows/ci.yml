# QA gate (company/BRIEF.md §4.8): build, engine unit tests, chart render matrix with PDF
# checks, privacy test. Runs on every pull request and every branch push, and is called by
# pages.yml before each deploy, so a red gate blocks the site from shipping.
name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when pages.yml calls this, so a deploy's gate never
  # cancels (or is cancelled by) the ordinary CI run for the same push.
  group: ${{ github.workflow }}-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install web dev dependencies (pdfkit, playwright)
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Install PyMuPDF for the PDF checks
        run: python -m pip install --disable-pip-version-check pymupdf==1.28.2 pillow

      - name: Expose Playwright at the path the chart smoke test imports
        # web/test/charts/scene-smoke.mjs imports /opt/node22/lib/node_modules/playwright/index.mjs
        # (the build machines' global install); point that path at the devDependency.
        run: |
          sudo mkdir -p /opt/node22/lib/node_modules
          sudo ln -sfn "$GITHUB_WORKSPACE/web/node_modules/playwright" /opt/node22/lib/node_modules/playwright

      - name: Build site
        run: node web/build.mjs

      - name: Engine unit tests
        run: node --test web/test/engine/

      - name: QA gate (chart unit tests, renderer smoke, chart matrix + pdfcheck, privacy)
        run: node web/test/run-all.mjs --skip build,engine

      - name: Report to the job summary
        if: always()
        run: |
          if [ -f web/test/out/report.md ]; then cat web/test/out/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the QA report and failing PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/test/out/
          if-no-files-found: ignore
          retention-days: 14
