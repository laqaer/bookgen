<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Gildroot</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1024" media="(prefers-color-scheme: dark)">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site.name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{site.url}}/assets/img/og-default.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{site.url}}/assets/img/og-default.png">

<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="mask-icon" href="/assets/img/favicon.svg" color="#141210">

<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/SourceSerif4-400.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/NotoSerifDisplay-XCn-900.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/Sans-600.woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css?v={{build}}">
