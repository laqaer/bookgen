<div class="dropzone" id="tool-dropzone">
  <div class="dropzone__head">
    <svg class="dropzone__icon" viewBox="0 0 40 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 14V6a2 2 0 0 1 2-2h10l4 5h14a2 2 0 0 1 2 2v6"/>
      <path d="M4 14h32l-3 28H7Z"/>
      <path d="M14 24v10M20 22v14M26 24v10"/>
    </svg>
    <div>
      <p class="dropzone__title">Drop a family tree file</p>
      <p class="dropzone__text">A .ged, .zip or .gdz file. It is read on this computer. Nothing is uploaded.</p>
    </div>
  </div>
  <div class="cluster">
    <label for="tool-file" class="btn btn--secondary btn--block-phone" role="button" tabindex="0">Choose a file</label>
    <input type="file" id="tool-file" class="visually-hidden" accept=".ged,.zip,.gdz" tabindex="-1">
    <button type="button" class="link-arrow" id="tool-sample">Or try the sample family</button>
  </div>
  <p class="dropzone__status" id="tool-status" aria-live="polite"></p>
</div>
